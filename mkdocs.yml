site_name: falsegreen
site_description: Find tests that pass green without protecting anything. The catalog and guide for the falsegreen family of false-green test scanners.
site_url: https://vinicq.github.io/falsegreen-docs/
repo_url: https://github.com/vinicq/falsegreen-docs
repo_name: vinicq/falsegreen-docs
edit_uri: edit/main/docs/
copyright: MIT licensed. The falsegreen family.

validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            User Guide: Guia do usuário
            Catalog: Catálogo
            Overview: Visão geral
            Concepts: Conceitos
            Scanners: Scanners
            Research: Pesquisa
            Credits: Créditos
            "Failure taxonomy (F1-F8)": "Taxonomia de falhas (F1-F8)"
            "Judgments (J1-J6)": "Julgamentos (J1-J6)"
            "The oracle hierarchy": "A hierarquia de oráculos"
            "Test pyramid and levels": "Pirâmide de testes e níveis"
            "Patterns by language and test level": "Padrões por linguagem e nível de teste"
            "What we do not flag": "O que não sinalizamos"
            "Scope and honesty": "Escopo e honestidade"
            "Coverage vs the literature": "Cobertura vs a literatura"
            "Coverage by family": "Cobertura por família"
            "Semantic (LLM)": "Semântico (LLM)"
            "Gherkin & Tavern": "Gherkin e Tavern"

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Catalog:
      - Overview: catalog/index.md
      - Python: catalog/python.md
      - JavaScript / TypeScript: catalog/javascript-typescript.md
      - Robot Framework: catalog/robot.md
      - Semantic (LLM): catalog/semantic.md
      - Gherkin & Tavern: catalog/gherkin-tavern.md
  - Concepts:
      - Failure taxonomy (F1-F8): concepts/taxonomy.md
      - Judgments (J1-J6): concepts/judgments.md
      - The oracle hierarchy: concepts/oracle.md
      - Test pyramid and levels: concepts/pyramid.md
      - Patterns by language and test level: concepts/by-test-level.md
      - What we do not flag: concepts/what-we-do-not-flag.md
      - Scope and honesty: concepts/scope.md
      - Coverage vs the literature: concepts/denominator.md
      - Coverage by family: concepts/coverage.md
  - Scanners:
      - falsegreen (Python): scanners/python.md
      - falsegreen-js (JS/TS): scanners/javascript.md
      - robotframework-falsegreen: scanners/robot.md
      - falsegreen-skill (LLM): scanners/skill.md
  - Research: research.md
  - Credits: credits.md
