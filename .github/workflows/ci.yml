name: ci

# PR-blocking docs gate (#1): a broken internal link, a missing nav page, or a bad
# config should fail the PR, not ship silently on deploy.
#
# The BLOCKING gate is `mkdocs build --strict`: it promotes to errors any warning
# for a broken internal link, an unresolved reference, a page missing from the nav,
# or a bad config (the same build deploy-docs runs, now on every PR and push).
#
# The lychee link check is advisory (continue-on-error): it scans the built site for
# broken links and reports them in the run summary, but does not block, because this
# is a GitHub Pages project site whose root-relative `/falsegreen-docs/` links are an
# offline-resolution edge that should not gate a PR. Internal-link breakage is already
# caught by --strict above.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Strict build (blocking gate)
        run: mkdocs build --strict
      - name: Link check (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --include-fragments 'site/**/*.html'"
          fail: true
